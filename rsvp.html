<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSVP · Sindhu &amp; Anand</title>
<meta name="theme-color" content="#2a0d12">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/ganesha.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css?v=202610051452">
</head>
<body class="rsvp-page">
<main class="page">
  <section class="rsvp" id="rsvp" aria-labelledby="rsvpTitle">
    <a class="rsvp-close" id="backBtn" href="index.html?open" aria-label="Close and go back to the invitation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <div class="rsvp-inner">
      <header>
        <p class="eyebrow">RSVP · kindly reply by <span id="rsvpBy"></span></p>
        <h2 id="rsvpTitle">Will you join us?</h2>
        <p class="sub">Let us know if you can make it, so we can keep a seat and a banana leaf ready for you.</p>
      </header>

      <form id="rsvpForm" novalidate>
        <div class="field">
          <label for="f-name">Your name</label>
          <input id="f-name" name="name" type="text" autocomplete="name" required placeholder="e.g. Priya & family">
        </div>
        <div class="field">
          <span class="flabel" id="attLabel">Will you attend?</span>
          <div class="choice" role="radiogroup" aria-labelledby="attLabel">
            <label><input type="radio" name="attending" id="f-yes" value="Yes" checked>Joyfully accept<small>We'll be there</small></label>
            <label><input type="radio" name="attending" id="f-no" value="No">Regretfully decline<small>Sending blessings</small></label>
          </div>
        </div>
        <div class="when-yes">
          <div class="field">
            <span class="flabel">Which events?</span>
            <div class="events">
              <label><input type="checkbox" id="f-reception" name="reception" checked>Reception · 14 Nov</label>
              <label><input type="checkbox" id="f-wedding" name="wedding" checked>Wedding · 15 Nov</label>
            </div>
          </div>
          <div class="field">
            <span class="flabel" id="guestsLabel">Number of guests <span class="opt">(including you)</span></span>
            <div class="stepper" aria-labelledby="guestsLabel">
              <button type="button" id="g-minus" aria-label="One fewer guest">−</button>
              <output id="f-guests" aria-live="polite">1</output>
              <button type="button" id="g-plus" aria-label="One more guest">+</button>
            </div>
          </div>
        </div>
        <div class="field">
          <label for="f-phone">WhatsApp number <span class="opt">(optional)</span></label>
          <input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+91 98765 43210">
        </div>
        <div class="field">
          <label for="f-msg">Wishes for the couple <span class="opt">(optional)</span></label>
          <textarea id="f-msg" name="message" placeholder="A blessing, a memory, or just hello"></textarea>
        </div>
        <button class="submit" type="submit" id="submitBtn">Send RSVP</button>
        <p class="form-msg" id="formMsg" role="alert"></p>
      </form>

      <div class="thanks" id="thanks" hidden>
        <h3 id="thanksTitle">Thank you!</h3>
        <p id="thanksText"></p>
        <a class="submit back-btn" id="backBtn2" href="index.html?open">Back to the invitation</a>
        <button class="linkish" type="button" id="editRsvp">Change my response</button>
      </div>
    </div>
  </section>
  <a class="back-link" id="backLink" href="index.html?open">← Back to the invitation</a>
</main>
<canvas id="petals" aria-hidden="true"></canvas>
<script src="config.js?v=202610051452"></script>
<script src="petals.js?v=202610051452"></script>
<script src="rsvp.js?v=202610051452"></script>
</body>
</html>
